<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Sitio en construcción | GamesAlone18 Universe
    </title>

    <meta
        name="description"
        content="GamesAlone18 Universe se encuentra realizando mejoras. Volveremos muy pronto."
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <link
        rel="icon"
        href="/img/favicon.png"
        type="image/png"
    >

    <link
        rel="preload"
        as="image"
        href="/home/img/bg-masthead.jpg"
    >

    <link
        rel="stylesheet"
        href="/mantenimiento.css"
    >

</head>


<body>


    <!-- =====================================================
         FONDO
    ====================================================== -->

    <div class="maintenance-background"></div>

    <div class="maintenance-overlay"></div>


    <!-- =====================================================
         CONTENIDO
    ====================================================== -->

    <main class="maintenance-page">


        <!-- LOGO -->

        <div class="maintenance-logo">

            <img
                src="/img/favicon.png"
                alt="GamesAlone18 Universe"
            >

        </div>


        <!-- ETIQUETA -->

        <div class="maintenance-label">

            <span class="status-dot"></span>

            SITIO EN CONSTRUCCIÓN

        </div>


        <!-- TITULO -->

        <h1>

            Estamos
            <span>mejorando.</span>

        </h1>


        <!-- DESCRIPCIÓN -->

        <p class="maintenance-description">

            Estamos realizando algunos cambios y mejoras
            para ofrecerte una mejor experiencia dentro de
            <strong>GamesAlone18 Universe</strong>.

        </p>


        <p class="maintenance-message">

            Disculpen las molestias.
            <br>
            Volveremos muy pronto.

        </p>


        <!-- LINEA -->

        <div class="maintenance-line">

            <span></span>

        </div>


        <!-- MARCA -->

        <div class="maintenance-brand">

            <strong>
                GAMESALONE18
            </strong>

            <span>
                UNIVERSE
            </span>

        </div>


    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="maintenance-footer">

        © GamesAlone18 Universe

    </footer>


</body>

</html>
