
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Acceso privado | Chocolate Artístico Sarita</title>

    <link rel="stylesheet" href="./css/sarita-global.css">
  <link rel="stylesheet" href="./css/sarita-componentes.css">
  <link rel="stylesheet" href="./css/modulos/index.css">
</head>

<body>

  <main class="login">

    <div class="marca">
      <div class="marca-icono" aria-hidden="true">S</div>

      <h1>Chocolate Artístico Sarita</h1>

      <p class="subtitulo">
        Sistema privado de cotizaciones<br>
        Acceso exclusivo para administradores
      </p>
    </div>

    <form id="loginForm">

      <div class="campo">
        <label for="correo">Correo electrónico</label>

        <input
          type="email"
          id="correo"
          name="correo"
          autocomplete="username"
          placeholder="correo@ejemplo.com"
          required
        >
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>

        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          placeholder="Ingresa tu contraseña"
          required
        >
      </div>

      <button type="submit" id="btnLogin">
        Iniciar sesión
      </button>

      <p
        class="mensaje"
        id="mensaje"
        role="status"
        aria-live="polite"
      ></p>

    </form>

    <div class="pie">
      Panel administrativo privado<br>
      Chocolate Artístico Sarita
    </div>

  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD1yzWoD_emq-P5Ux47U6G0TCkhUqYOgJ4",
      authDomain: "sarita-cotizador.firebaseapp.com",
      projectId: "sarita-cotizador",
      storageBucket: "sarita-cotizador.firebasestorage.app",
      messagingSenderId: "798881105496",
      appId: "1:798881105496:web:c42f8cd5655e9585d02c2d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("loginForm");
    const boton = document.getElementById("btnLogin");
    const mensaje = document.getElementById("mensaje");

    async function verificarAdministrador(user) {
      // Esta lectura está protegida por las reglas de Firestore.
      // Solo los dos UID autorizados pueden realizarla.
      await getDoc(doc(db, "configuracion", "acceso"));
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;

      try {
        await verificarAdministrador(user);

        // Activaremos esta redirección cuando exista panel.html.
       window.location.replace("./panel.html");
        
      } catch (error) {
        await signOut(auth);
        mensaje.textContent = "Esta cuenta no tiene acceso al cotizador.";
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      mensaje.textContent = "";
      boton.disabled = true;
      boton.textContent = "Verificando acceso...";

      const correo = document.getElementById("correo").value.trim();
      const password = document.getElementById("password").value;

      try {
        const credenciales = await signInWithEmailAndPassword(
          auth,
          correo,
          password
        );

        await verificarAdministrador(credenciales.user);

        mensaje.style.color = "#26734d";
        mensaje.textContent = "Acceso autorizado correctamente.";

      } catch (error) {
        if (auth.currentUser) {
          await signOut(auth);
        }

        mensaje.style.color = "#a42d42";

        if (error.code === "permission-denied") {
          mensaje.textContent = "Esta cuenta no está autorizada.";
        } else {
          mensaje.textContent =
            "No fue posible iniciar sesión. Verifica tus datos e inténtalo nuevamente.";
        }

      } finally {
        boton.disabled = false;
        boton.textContent = "Iniciar sesión";
      }
    });
  </script>

</body>
</html>
